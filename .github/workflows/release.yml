name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - build/ci-test-builds

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Free gitleaks CLI (pinned + checksum-verified); see ci.yml.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz
      - name: Scan git history for secrets
        run: ./gitleaks git --config .gitleaks.toml --redact --verbose --exit-code 1 .

  verify:
    needs: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - run: cp .env.example .env

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-android:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GOTOOLCHAIN: local
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Read version
        id: version
        run: |
          VERSION_LINE="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          VERSION_NAME="${VERSION_LINE%%+*}"
          VERSION_CODE="${VERSION_LINE##*+}"
          echo "version_name=${VERSION_NAME}" >> "${GITHUB_OUTPUT}"
          echo "version_code=${VERSION_CODE}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${VERSION_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Setup Android NDK
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/28.2.13676358" >> "${GITHUB_ENV}"

      - name: Pre-install pinned gobind
        run: |
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260611195102-4dd8f1dbf5d2
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"

      - name: Build libbox
        run: ./scripts/build-libbox.sh

      # Google Sign-In only accepts APKs whose signing-certificate SHA-1 is
      # registered for com.erebrus.vpn in Google Cloud, so sideload builds need
      # one stable key. Store it as ANDROID_SIDELOAD_KEYSTORE_B64 (base64 of a
      # PKCS12 keystore, alias erebrus-vpn-sideload) +
      # ANDROID_SIDELOAD_KEYSTORE_PASSWORD. Without them we fall back to a
      # throwaway key: the APK installs, but Google login fails (code 10).
      - name: Configure sideload signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_SIDELOAD_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIDELOAD_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p android/release-keys
          KS=android/release-keys/erebrus-vpn-sideload.p12
          if [[ -n "${KEYSTORE_B64}" && -n "${KEYSTORE_PASSWORD}" ]]; then
            echo "${KEYSTORE_B64}" | base64 --decode > "${KS}"
            PASS="${KEYSTORE_PASSWORD}"
            echo "Using stable sideload signing key from secrets"
          else
            echo "::warning::ANDROID_SIDELOAD_KEYSTORE_B64/PASSWORD not set — signing with a throwaway key. Google Sign-In will fail (ApiException 10) on this build."
            PASS=ci-sideload
            keytool -genkeypair \
              -storetype PKCS12 -keystore "${KS}" \
              -alias erebrus-vpn-sideload \
              -keyalg RSA -keysize 2048 -validity 1 \
              -storepass "${PASS}" -keypass "${PASS}" \
              -dname "CN=Erebrus VPN CI, OU=Sideload, O=NetSepio, L=CI, ST=CI, C=US"
          fi
          {
            for flavor in playstore dappstore; do
              echo "${flavor}.storeFile=../release-keys/erebrus-vpn-sideload.p12"
              echo "${flavor}.storePassword=${PASS}"
              echo "${flavor}.keyAlias=erebrus-vpn-sideload"
              echo "${flavor}.keyPassword=${PASS}"
            done
          } > android/key.properties
          echo "Signing certificate SHA-1 (register this for com.erebrus.vpn in Google Cloud):"
          keytool -list -v -keystore "${KS}" -storepass "${PASS}" -alias erebrus-vpn-sideload | grep -E "SHA1:" || true

      - name: Configure build env
        shell: bash
        env:
          REOWN_PROJECT_ID: ${{ secrets.REOWN_PROJECT_ID }}
          # Repo variable; set to "true" once the Android OAuth client for the
          # signing key's SHA-1 exists in Google Cloud. Unset hides the button.
          GOOGLE_LOGIN_ENABLED: ${{ vars.GOOGLE_LOGIN_ENABLED }}
        run: |
          {
            echo "REOWN_PROJECT_ID=${REOWN_PROJECT_ID}"
            echo "EREBRUS_WEB_ORIGIN=https://erebrus.io"
            echo "GATEWAY_URL=https://gateway.erebrus.io"
            echo "GOOGLE_LOGIN_ENABLED=${GOOGLE_LOGIN_ENABLED}"
          } > .env
          if [[ -z "${REOWN_PROJECT_ID}" ]]; then
            echo "::warning::REOWN_PROJECT_ID secret is empty — wallet login (Reown/WalletConnect) will be unavailable in this build."
          fi

      - run: flutter pub get

      - name: Build release APKs
        run: |
          flutter build apk --flavor playstore --release
          flutter build apk --flavor dappstore --release

      - name: Package sideload artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-playstore-release.apk \
            "dist/erebrus-vpn-playstore-${{ steps.version.outputs.tag }}.apk"
          cp build/app/outputs/flutter-apk/app-dappstore-release.apk \
            "dist/erebrus-vpn-dappstore-${{ steps.version.outputs.tag }}.apk"
          cat > dist/README.txt <<EOF
          Erebrus VPN sideload builds (${{ steps.version.outputs.version_name }}+${{ steps.version.outputs.version_code }})

          These APKs are built in CI with an ephemeral signing key for testing only.
          They are not signed for Google Play or the Solana dApp Store.

          - erebrus-vpn-playstore-*.apk  -> general Android / Google Play flavor
          - erebrus-vpn-dappstore-*.apk  -> Solana dApp Store flavor
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: android-sideload-${{ steps.version.outputs.tag }}
          if-no-files-found: error
          path: dist/*

  build-macos:
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      GOTOOLCHAIN: local
    steps:
      # The macOS app embeds the ErebrusTunnel Network Extension, which Xcode
      # only builds with NetSepio's Apple Developer team (76KW3AMAW5) signing
      # and provisioning profiles. Until those are available to CI, skip the
      # build (job stays green) instead of failing on "No profiles found".
      # Set the repo variable ENABLE_MACOS_BUILD=true once signing is set up.
      - name: Check macOS signing availability
        id: gate
        env:
          ENABLED: ${{ vars.ENABLE_MACOS_BUILD }}
        run: |
          if [[ "${ENABLED}" == "true" ]]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::macOS build skipped — needs Apple Developer signing for team 76KW3AMAW5. Set repo variable ENABLE_MACOS_BUILD=true once it is configured."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'

      - uses: actions/setup-go@v5
        if: steps.gate.outputs.enabled == 'true'
        with:
          go-version: "1.25"

      - uses: subosito/flutter-action@v2
        if: steps.gate.outputs.enabled == 'true'
        with:
          channel: stable
          cache: true

      - name: Read version tag
        if: steps.gate.outputs.enabled == 'true'
        id: version
        run: |
          VERSION_LINE="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          VERSION_NAME="${VERSION_LINE%%+*}"
          echo "tag=v${VERSION_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Configure build env
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        env:
          REOWN_PROJECT_ID: ${{ secrets.REOWN_PROJECT_ID }}
          GOOGLE_LOGIN_ENABLED: ${{ vars.GOOGLE_LOGIN_ENABLED }}
        run: |
          {
            echo "REOWN_PROJECT_ID=${REOWN_PROJECT_ID}"
            echo "EREBRUS_WEB_ORIGIN=https://erebrus.io"
            echo "GATEWAY_URL=https://gateway.erebrus.io"
            echo "GOOGLE_LOGIN_ENABLED=${GOOGLE_LOGIN_ENABLED}"
          } > .env
          if [[ -z "${REOWN_PROJECT_ID}" ]]; then
            echo "::warning::REOWN_PROJECT_ID secret is empty — wallet login (Reown/WalletConnect) will be unavailable in this build."
          fi

      - name: Pre-install pinned gobind
        if: steps.gate.outputs.enabled == 'true'
        run: |
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260611195102-4dd8f1dbf5d2
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"

      # One interpreter for install and run: the runner's bare `pip` targets a
      # different Python than `python3`, so Pillow went missing.
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.enabled == 'true'
        with:
          python-version: "3.12"
      - if: steps.gate.outputs.enabled == 'true'
        run: python -m pip install pillow
      - if: steps.gate.outputs.enabled == 'true'
        run: chmod +x scripts/build-desktop.sh scripts/fetch-singbox-cli.sh
      - if: steps.gate.outputs.enabled == 'true'
        run: ./scripts/build-desktop.sh macos

      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          name: macos-${{ steps.version.outputs.tag }}
          if-no-files-found: error
          path: dist/*

  build-linux:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libwebkit2gtk-4.1-dev libsecret-1-dev libjsoncpp-dev libayatana-appindicator3-dev

      - name: Read version tag
        id: version
        run: |
          VERSION_LINE="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          VERSION_NAME="${VERSION_LINE%%+*}"
          echo "tag=v${VERSION_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Configure build env
        shell: bash
        env:
          REOWN_PROJECT_ID: ${{ secrets.REOWN_PROJECT_ID }}
          # Repo variable; set to "true" once the Android OAuth client for the
          # signing key's SHA-1 exists in Google Cloud. Unset hides the button.
          GOOGLE_LOGIN_ENABLED: ${{ vars.GOOGLE_LOGIN_ENABLED }}
        run: |
          {
            echo "REOWN_PROJECT_ID=${REOWN_PROJECT_ID}"
            echo "EREBRUS_WEB_ORIGIN=https://erebrus.io"
            echo "GATEWAY_URL=https://gateway.erebrus.io"
            echo "GOOGLE_LOGIN_ENABLED=${GOOGLE_LOGIN_ENABLED}"
          } > .env
          if [[ -z "${REOWN_PROJECT_ID}" ]]; then
            echo "::warning::REOWN_PROJECT_ID secret is empty — wallet login (Reown/WalletConnect) will be unavailable in this build."
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pillow
      - run: chmod +x scripts/build-desktop.sh scripts/fetch-singbox-cli.sh
      - run: ./scripts/build-desktop.sh linux

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ steps.version.outputs.tag }}
          if-no-files-found: error
          path: dist/*

  build-windows:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 60
    # The runner default is PowerShell, which hands `./scripts/*.sh` to the
    # file association instead of running it — the build silently did nothing.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Read version tag
        id: version
        shell: bash
        run: |
          VERSION_LINE="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          VERSION_NAME="${VERSION_LINE%%+*}"
          echo "tag=v${VERSION_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Configure build env
        shell: bash
        env:
          REOWN_PROJECT_ID: ${{ secrets.REOWN_PROJECT_ID }}
          # Repo variable; set to "true" once the Android OAuth client for the
          # signing key's SHA-1 exists in Google Cloud. Unset hides the button.
          GOOGLE_LOGIN_ENABLED: ${{ vars.GOOGLE_LOGIN_ENABLED }}
        run: |
          {
            echo "REOWN_PROJECT_ID=${REOWN_PROJECT_ID}"
            echo "EREBRUS_WEB_ORIGIN=https://erebrus.io"
            echo "GATEWAY_URL=https://gateway.erebrus.io"
            echo "GOOGLE_LOGIN_ENABLED=${GOOGLE_LOGIN_ENABLED}"
          } > .env
          if [[ -z "${REOWN_PROJECT_ID}" ]]; then
            echo "::warning::REOWN_PROJECT_ID secret is empty — wallet login (Reown/WalletConnect) will be unavailable in this build."
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pillow
      - run: chmod +x scripts/build-desktop.sh scripts/fetch-singbox-cli.sh
      - run: ./scripts/build-desktop.sh windows

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ steps.version.outputs.tag }}
          if-no-files-found: error
          path: dist/*

  github-release:
    needs: [build-android, build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION_LINE="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          VERSION_NAME="${VERSION_LINE%%+*}"
          VERSION_CODE="${VERSION_LINE##*+}"
          echo "version_name=${VERSION_NAME}" >> "${GITHUB_OUTPUT}"
          echo "version_code=${VERSION_CODE}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${VERSION_NAME}" >> "${GITHUB_OUTPUT}"

      # Publish once per version: a pubspec version that already has a tag is
      # never re-tagged or overwritten — bump `version:` to publish a new one.
      # Pushes with an unchanged version still build and upload CI artifacts.
      - name: Check whether this version is already released
        id: existing
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "::notice::${TAG} is already released — skipping publish. Bump version in pubspec.yaml to publish a new release."
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Create and push tag
        if: steps.existing.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - uses: actions/download-artifact@v4
        if: steps.existing.outputs.exists == 'false'
        with:
          pattern: "*-${{ steps.version.outputs.tag }}"
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v2
        if: steps.existing.outputs.exists == 'false'
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Erebrus VPN ${{ steps.version.outputs.version_name }}
          generate_release_notes: true
          body: |
            Sideload builds for testing. Android APKs are not signed with production store keys.

            Version: `${{ steps.version.outputs.version_name }}+${{ steps.version.outputs.version_code }}`

            | Artifact | Platform |
            |----------|----------|
            | `erebrus-vpn-playstore-*.apk` | Android (Google Play flavor) |
            | `erebrus-vpn-dappstore-*.apk` | Android (Solana dApp Store) |
            | `erebrus-vpn-macos-*.zip` | macOS `.app` |
            | `erebrus-vpn-windows-*.zip` | Windows |
            | `erebrus-vpn-linux-*.tar.gz` | Linux bundle |
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}